<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpotFit - Sign Up</title>
    <link rel="stylesheet" href="signup.css" />
    <link rel="icon" href="favicon.ico">
</head>

<body>

    <div class="login-wrapper">

    <div class="logo-container">
        <img src="logo definitivo.png" class="logo-img" alt="SpotFit Logo">
        <div class="brand-name">SPOTFIT</div>
    </div>

    <form (ngSubmit)="onSignup()" #signupForm="ngForm">

        <div class="row">
            <div class="form-group half">
                <label class="form-label">First Name*</label>
                <input 
                    type="text" 
                    class="form-input" 
                    placeholder="John"
                    [(ngModel)]="nombre"
                    name="nombre"
                    required
                />
            </div>

            <div class="form-group half">
                <label class="form-label">Last Name*</label>
                <input 
                    type="text" 
                    class="form-input" 
                    placeholder="Doe"
                    [(ngModel)]="apellido"
                    name="apellido"
                    required
                />
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Email*</label>
            <input 
                type="email" 
                class="form-input" 
                placeholder="your.email@example.com"
                [(ngModel)]="email"
                name="email"
                required
            />
        </div>

        <div class="form-group">
            <label class="form-label">Phone Number*</label>
            <input 
                type="text" 
                class="form-input" 
                placeholder="+34 600 000 000"
                [(ngModel)]="telefono"
                name="telefono"
                required
            />
        </div>

        <div class="row">
            <div class="form-group half">
                <label class="form-label">Password*</label>
                <input 
                    type="password" 
                    class="form-input" 
                    placeholder="********"
                    [(ngModel)]="contrasena"
                    name="contrasena"
                    required
                />
            </div>

            <div class="form-group half">
                <label class="form-label">Confirm Password*</label>
                <input 
                    type="password" 
                    class="form-input" 
                    placeholder="********"
                    [(ngModel)]="confirmarContrasena"
                    name="confirmarContrasena"
                    required
                />
            </div>
        </div>

        <label class="checkbox-container">
            <input 
                type="checkbox"
                [(ngModel)]="acepta"
                name="acepta"
                required
            />
            <span>I agree to the Terms and Conditions and Privacy Policy</span>
        </label>

        <button class="submit-btn" type="submit">Create Account</button>

        <p class="register-text">
            Already have an account?
            <a routerLink="/login">Sign in here</a>
        </p>

    </form>

</div>


</body>

</html>
