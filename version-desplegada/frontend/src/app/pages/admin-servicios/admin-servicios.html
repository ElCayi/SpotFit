<div class="container">

  <h2>Administrar Servicios</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form">

    <input type="text" placeholder="Nombre" formControlName="nombre">
    <input type="text" placeholder="Descripción" formControlName="descripcion">
    <input type="number" placeholder="Duración (min)" formControlName="duracion">

    <button type="submit">
      {{ editingId ? 'Actualizar' : 'Crear' }}
    </button>

    <button type="button" (click)="reset()">Cancelar</button>

  </form>

  <hr>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Duración</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let s of servicios">
        <td>{{ s.idServicio }}</td>
        <td>{{ s.nombre }}</td>
        <td>{{ s.descripcion }}</td>
        <td>
          <button (click)="edit(s)">Editar</button>
          <button (click)="delete(s.idServicio!)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
