<div class="login-wrapper">

    <div class="logo-container">
        <img src="logo.svg" class="logo-img" alt="SpotFit Logo">
        <div class="brand-name">SPOTFIT</div>
    </div>

    <form (ngSubmit)="onSignup()" #signupForm="ngForm">

        <div class="row">
            <div class="form-group half">
                <label class="form-label">Nombre*</label>
                <input 
                    type="text" 
                    class="form-input" 
                    placeholder="Nombre"
                    [(ngModel)]="nombre"
                    name="nombre"
                    required
                />
            </div>

            <div class="form-group half">
                <label class="form-label">Apellidos*</label>
                <input 
                    type="text" 
                    class="form-input" 
                    placeholder="Apellidos"
                    [(ngModel)]="apellido"
                    name="apellido"
                    required
                />
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Correo electrónico*</label>
            <input 
                type="email" 
                class="form-input" 
                placeholder="tu.email@ejemplo.com"
                [(ngModel)]="email"
                name="email"
                required
            />
        </div>

        <div class="form-group">
            <label class="form-label">Teléfono*</label>
            <input 
                type="text" 
                class="form-input" 
                placeholder="+34 600 000 000"
                [(ngModel)]="telefono"
                name="telefono"
                required
            />
        </div>

        <div class="row">
            <div class="form-group half">
                <label class="form-label">Contraseña*</label>
                <input 
                    type="password" 
                    class="form-input" 
                    placeholder="********"
                    [(ngModel)]="contrasena"
                    name="contrasena"
                    required
                />
            </div>

            <div class="form-group half">
                <label class="form-label">Confirmar contraseña*</label>
                <input 
                    type="password" 
                    class="form-input" 
                    placeholder="********"
                    [(ngModel)]="confirmarContrasena"
                    name="confirmarContrasena"
                    required
                />
            </div>
        </div>

        <label class="checkbox-container">
            <input 
                type="checkbox"
                [(ngModel)]="acepta"
                name="acepta"
                required
            />
            <span>I agree to the Terms and Conditions and Privacy Policy</span>
        </label>

        <button class="submit-btn" type="submit">Crear cuenta</button>

        <p class="register-text">
            ¿Ya tienes cuenta?
            <a routerLink="/login">Inicia sesión aquí</a>
        </p>

    </form>

</div>
