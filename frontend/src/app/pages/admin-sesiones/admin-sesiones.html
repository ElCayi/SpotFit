<div class="container">

<h2>Gestión de Sesiones</h2>

<form [formGroup]="form" (ngSubmit)="submit()" class="form">

  <input placeholder="Título" formControlName="titulo">
  <input placeholder="Descripción" formControlName="descripcion">
  <input type="date" formControlName="fecha">
  <input type="time" formControlName="hora">
  <input placeholder="ID Sala" formControlName="salaId">
  <input placeholder="ID Servicio" formControlName="servicioId">

  <button type="submit">
    {{ editingId ? 'Actualizar' : 'Crear' }}
  </button>

  <button type="button" (click)="resetForm()">Cancelar</button>

</form>

<hr>

<table>
  <tr>
    <th>ID</th>
    <th>Título</th>
    <th>Fecha</th>
    <th>Acciones</th>
  </tr>

  <tr *ngFor="let s of sesiones">
    <td>{{ s.idSesion }}</td>
    <td>{{ s.idServicio }}</td>
    <td>{{ s.fechaInicio }}</td>
    <td>
      <button (click)="edit(s)">Editar</button>
      <button (click)="delete(s.idSesion)">Eliminar</button>
    </td>
  </tr>
</table>

</div>
