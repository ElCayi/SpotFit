<div class="container">
  <h2>Gestión de Sesiones</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form">
    
    <input type="date" formControlName="fecha" title="Fecha de la sesión">
    <input type="time" formControlName="hora" title="Hora de inicio">
    
    <input type="number" placeholder="ID de la Sala" formControlName="salaId">
    <input type="number" placeholder="ID del Servicio" formControlName="servicioId">
    
    <input type="number" placeholder="ID del Monitor (Usuario)" formControlName="monitorId">
    
    <input type="number" placeholder="Aforo Máximo" formControlName="aforoMaximo">

    <button type="submit">
      {{ editingId ? 'Actualizar' : 'Crear' }}
    </button>
    <button type="button" (click)="resetForm()">Cancelar</button>

  </form>

  <hr>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Servicio</th>
      <th>Sala</th>
      <th>Monitor</th>
      <th>Fecha y Hora</th>
      <th>Aforo</th>
      <th>Acciones</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let s of sesiones">
      <td>{{ s.idSesion }}</td>
      
      <td>{{ s.nombreServicio }}</td>
      <td>{{ s.nombreSala }}</td>
      <td>{{ s.nombreMonitor }}</td>
      
      <td>{{ s.fechaInicio | date:'dd/MM/yyyy HH:mm' }}</td>
      <td>{{ s.aforoMaximo }}</td>
      
      <td>
        <button (click)="edit(s)">Editar</button>
        <button (click)="delete(s.idSesion!)">Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>

</div>
