<div class="container">
  <h2>Administrar Usuarios</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form">
    
    <input type="text" placeholder="Nombre" formControlName="nombre">
    <input type="text" placeholder="Apellidos" formControlName="apellidos">
    
    <input type="email" placeholder="Email" formControlName="email">
    <input type="password" placeholder="Contraseña (Ej: {noop}1234)" formControlName="contrasena">
    
    <select formControlName="activo">
      <option value="true">Usuario Activo</option>
      <option value="false">Usuario Inactivo</option>
    </select>
    
    <input type="number" placeholder="ID Perfil (1=Admin, 2=Monitor, 3=Cliente)" formControlName="perfilId">

    <button type="submit">
      {{ editingId ? 'Actualizar' : 'Crear' }}
    </button>
    <button type="button" (click)="reset()">Cancelar</button>
  </form>

  <hr>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre Completo</th>
        <th>Email</th>
        <th>Perfil</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let u of usuarios">
        <td>{{ u.idUsuario }}</td>
        
        <td>{{ u.nombre }} {{ u.apellidos }}</td>
        
        <td>{{ u.email }}</td>
        
        <td>{{ u.rol }}</td>
        
        <td>{{ u.activo ? '✅ Activo' : '❌ Baja' }}</td>
        
        <td>
          <button (click)="edit(u)">Editar</button>
          <button (click)="delete(u.idUsuario!)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
